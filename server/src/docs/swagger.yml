openapi: 3.1.0
info:
  title: 'Kaizen API'
  version: 1.0.0
  description: 'All endpoints return JSON envelopes: {success: true, data} or {success: false, error: {code, message, details?}}. Authenticate with `Authorization: Bearer <accessToken>`; the refresh token lives in an httpOnly cookie. Requests are rate limited: a global per-IP limit (429 RATE_LIMITED) plus per-user limits on AI, reminders and admin routes.'
servers:
  -
    url: 'http://localhost:5000/api/v1'
tags:
  -
    name: System
  -
    name: Auth
  -
    name: Profile
  -
    name: Foods
  -
    name: Recipes
  -
    name: Analytics
  -
    name: Summary
  -
    name: Reports
  -
    name: Gamification
  -
    name: AI
  -
    name: Search
  -
    name: External
  -
    name: Reminders
  -
    name: Water
  -
    name: Meals
  -
    name: Weight
  -
    name: Sleep
  -
    name: Measurements
  -
    name: Exercises
  -
    name: Workouts
  -
    name: Routines
  -
    name: Inventory
  -
    name: Planner
  -
    name: Admin
security:
  -
    bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Success:
      type: object
      required:
        - success
      properties:
        success:
          const: true
        data: {}
    Error:
      type: object
      required:
        - success
        - error
      properties:
        success:
          const: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              examples:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - RATE_LIMITED
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
paths:
  /health:
    get:
      tags:
        - System
      summary: 'Liveness and database status'
      description: 'Not rate limited. Returns {status:"ok", db:"up"|"down"}.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/register:
    post:
      tags:
        - Auth
      summary: 'Register a user (sets the refresh cookie)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                email:
                  type: string
                  format: email
                  pattern: '^(?!\.)(?!.*\.\.)([A-Za-z0-9_''+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$'
                password:
                  type: string
                  minLength: 8
                timezone:
                  type: string
              required:
                - name
                - email
                - password
      security: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: 'Validation error (VALIDATION_ERROR) with per-field details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      tags:
        - Auth
      summary: 'Log in (sets the refresh cookie)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  pattern: '^(?!\.)(?!.*\.\.)([A-Za-z0-9_''+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$'
                password:
                  type: string
                  minLength: 1
                timezone:
                  type: string
              required:
                - email
                - password
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: 'Validation error (VALIDATION_ERROR) with per-field details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: 'Rotate the refresh token (cookie) and issue a new access token'
      description: 'A refresh token can be used once; replays return 401.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: 'Revoke the refresh token and clear the cookie'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: 'Request a password reset (mock: logs the link)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  pattern: '^(?!\.)(?!.*\.\.)([A-Za-z0-9_''+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$'
              required:
                - email
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: 'Validation error (VALIDATION_ERROR) with per-field details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/me:
    get:
      tags:
        - Auth
      summary: 'The authenticated user'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: 'Missing, invalid or expired access token, or a deactivated account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /profile:
    get:
      tags:
        - Profile
      summary: 'Profile and TDEE'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: 'Missing, invalid or expired access token, or a deactivated account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Profile
      summary: 'Update the profile (strict whitelist)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                dob:
                  type: string
                gender:
                  type: string
                  enum:
                    - male
                    - female
                    - other
                heightCm:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 300
                currentWeightKg:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 500
                activityLevel:
                  type: string
                  enum:
                    - sedentary
                    - lightly_active
                    - moderately_active
                    - very_active
                    - extra_active
                goal:
                  type: string
                  enum:
                    - lose_weight
                    - gain_weight
                    - maintain_weight
                targetWeightKg:
                  type: number
                  minimum: 25
                  maximum: 500
                targetDate:
                  type: string
                calorieDailyTarget:
                  type: number
                  exclusiveMinimum: 0
                proteinDailyTargetG:
                  type: number
                  exclusiveMinimum: 0
                waterDailyTargetMl:
                  type: number
                  exclusiveMinimum: 0
                units:
                  type: string
                  enum:
                    - metric
                    - imperial
                timezone:
                  type: string
                onboardingComplete:
                  type: boolean
                  const: true
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: 'Validation error (VALIDATION_ERROR) with per-field details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Missing, invalid or expired access token, or a deactivated account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /profile/goal-history:
    get:
      tags:
        - Profile
      summary: 'History of goal, target weight and target date changes'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: 'Missing, invalid or expired access token, or a deactivated account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /profile/goal-progress:
    get:
      tags:
        - Profile
      summary: 'Progress and pace toward the goal'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: 'Missing, invalid or expired access token, or a deactivated account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /profile/onboarding:
    post:
      tags:
        - Profile
      summary: 'Complete onboarding'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dob:
                  type: string
                gender:
                  type: string
                  enum:
                    - male
                    - female
                    - other
                heightCm:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 300
                currentWeightKg:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 500
                activityLevel:
                  type: string
                  enum:
                    - sedentary
                    - lightly_active
                    - moderately_active
                    - very_active
                    - extra_active
                goal:
                  type: string
                  enum:
                    - lose_weight
                    - gain_weight
                    - maintain_weight
                targetWeightKg:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 500
                calorieDailyTarget:
                  type: number
                  exclusiveMinimum: 0
                proteinDailyTargetG:
                  type: number
                  exclusiveMinimum: 0
                waterDailyTargetMl:
                  type: number
                  exclusiveMinimum: 0
              required:
                - dob
                - gender
                - heightCm
                - currentWeightKg
                - activityLevel
                - goal
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: 'Validation error (VALIDATION_ERROR) with per-field details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Missing, invalid or expired access token, or a deactivated account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /profile/tdee:
    post:
      tags:
        - Profile
      summary: 'Compute TDEE for the given body data'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: 'Validation error (VALIDATION_ERROR) with per-field details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Missing, invalid or expired access token, or a deactivated account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /foods/search:
    get:
      tags:
        - Foods
      summary: 'Search global foods and your custom foods'
      parameters:
        -
          name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        -
          name: limit
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: 'Validation error (VALIDATION_ERROR) with per-field details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Missing, invalid or expired access token, or a deactivated account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /foods:
    post:
      tags:
        - Foods
      summary: 'Create a custom food'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                brand:
                  type: string
                  maxLength: 100
                servingSize:
                  type: string
                  minLength: 1
                  maxLength: 50
                calories:
                  type: number
                  minimum: 0
                protein:
                  default: 0
                  type: number
                  minimum: 0
                carbs:
                  default: 0
                  type: number
                  minimum: 0
                fat:
                  default: 0
                  type: number
                  minimum: 0
              required:
                - name
                - servingSize
                - calories
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: 'Validation error (VALIDATION_ERROR) with per-field details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Missing, invalid or expired access token, or a deactivated account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/foods/{id}':
    delete:
      tags:
        - Foods
      summary: 'Delete one of your custom foods'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: 'Missing, invalid or expired access token, or a deactivated account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not found (or not yours)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /recipes:
    get:
      tags:
        - Recipes
      summary: 'Your recipes'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: 'Missing, invalid or expired access token, or a deactivated account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Recipes
      summary: 'Create a recipe'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                description:
                  type: string
                  maxLength: 300
                ingredients:
                  minItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      foodId: {type: string}
                      name: {type: string, minLength: 1}
                      servingSize: {type: string, minLength: 1}
                      quantity: {type: number, minimum: 0.1}
                      calories: {type: number, minimum: 0}
                      protein: {default: 0, type: number, minimum: 0}
                      carbs: {default: 0, type: number, minimum: 0}
                      fat: {default: 0, type: number, minimum: 0}
                    required:
                      - name
                      - servingSize
                      - quantity
                      - calories
                    additionalProperties: false
              required:
                - name
                - ingredients
              additionalProperties: false
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: 'Validation error (VALIDATION_ERROR) with per-field details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Missing, invalid or expired access token, or a deactivated account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/recipes/{id}':
    get:
      tags:
        - Recipes
      summary: 'One of your recipes'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: 'Missing, invalid or expired access token, or a deactivated account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not found (or not yours)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Recipes
      summary: 'Update a recipe (strict body)'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                description:
                  type: string
                  maxLength: 300
                ingredients:
                  minItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      foodId: {type: string}
                      name: {type: string, minLength: 1}
                      servingSize: {type: string, minLength: 1}
                      quantity: {type: number, minimum: 0.1}
                      calories: {type: number, minimum: 0}
                      protein: {default: 0, type: number, minimum: 0}
                      carbs: {default: 0, type: number, minimum: 0}
                      fat: {default: 0, type: number, minimum: 0}
                    required:
                      - name
                      - servingSize
                      - quantity
                      - calories
                    additionalProperties: false
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: 'Validation error (VALIDATION_ERROR) with per-field details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Missing, invalid or expired access token, or a deactivated account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not found (or not yours)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Recipes
      summary: 'Delete a recipe'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: 'Missing, invalid or expired access token, or a deactivated account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Not found (or not yours)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /analytics:
    get:
      tags:
        - Analytics
      summary: 'Daily aggregates for a window ending today'
      parameters:
        -
          name: days
          in: query
          required: false
          description: 'Window length 1..365 (default 30)'
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: 'Missing, invalid or expired access token, or a deactivated account'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit exceeded (RATE_LIMITED): global per-IP limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /summary:
    get:
      tags:
        - Summary
      summary: 'Everything logged for one date'
      parameters:
        -
          name: date
          in: query
          required: true
