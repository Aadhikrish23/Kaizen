name: Post-merge smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: [ '27017:27017' ]
    env:
      PORT: 5000
      MONGODB_URI: mongodb://localhost:27017/kaizen_ci
      JWT_SECRET: ci-only-jwt-secret-0123456789
      JWT_REFRESH_SECRET: ci-only-refresh-secret-0123456789
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run build
        working-directory: server
      - name: Start server
        working-directory: server
        env:
          NODE_ENV: production
        run: nohup npm start > ../server.log 2>&1 &
      - run: ./scripts/smoke.sh
      - name: Server log
        if: always()
        run: tail -n 100 server.log
