name: Post-merge smoke
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: [ '27017:27017' ]
    env:
      PORT: 5000
      MONGODB_URI: mongodb://localhost:27017/kaizen_ci
      JWT_SECRET: ci-only-jwt-secret-0123456789
      JWT_REFRESH_SECRET: ci-only-refresh-secret-0123456789
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai_services/requirements.txt
      - name: Install AI service
        working-directory: ai_services
        run: pip install -r requirements.txt
      - run: npm ci
        working-directory: server
      - run: npm run build
        working-directory: server
      - name: Start server
        working-directory: server
        env:
          NODE_ENV: production
          # The smoke run makes many requests from one IP; raise the global limiter here only (default stays 100)
          API_RATE_LIMIT_MAX: 100000
        run: nohup npm start > ../server.log 2>&1 &
      - name: Start AI service
        working-directory: ai_services
        env:
          # No model in CI: rules, fallbacks and the real tools still run against the real API
          AI_PROVIDER: nvidia
          AI_FALLBACK_PROVIDERS: ''
          NVIDIA_API_KEY: ''
          KAIZEN_API_URL: http://localhost:5000/api/v1
        run: nohup python -m uvicorn app.main:app --port 8000 > ../ai.log 2>&1 &
      - name: Wait for the AI service
        run: for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health > /dev/null && exit 0; sleep 1; done; tail -n 30 ai.log; exit 1
      - run: ./scripts/smoke.sh
      - name: Server and AI service logs
        if: always()
        run: tail -n 100 server.log ai.log
