server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx drops server-level add_header in any location that sets its own add_header, so every location includes this file
  include /etc/nginx/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Vite emits content-hashed files under /assets: cache them for a year
  location /assets/ {
    expires 1y;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Entry points that must always be revalidated so a new deploy is picked up
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /sw.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /registerSW.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /manifest.webmanifest {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # SPA fallback: deep links and refreshes (e.g. /settings/profile) get index.html, real files are served as is
  location / {
    try_files $uri /index.html;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
}
